name: Portfolio CI and production deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - "apps/packages/**"
      - "apps/package.json"
      - "apps/pnpm-lock.yaml"
      - "apps/pnpm-workspace.yaml"
      - "apps/turbo.json"
      - "apps/biome.json"
      - ".github/workflows/pipeline.yml"
      - "!**/README.md"
      - "!**/readme.md"
      - "!apps/portfolio/SETUP.md"
      - "!apps/portfolio/src/data/credential-logo-sources.md"
  push:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - "apps/packages/**"
      - "apps/package.json"
      - "apps/pnpm-lock.yaml"
      - "apps/pnpm-workspace.yaml"
      - "apps/turbo.json"
      - "apps/biome.json"
      - ".github/workflows/pipeline.yml"
      - "!**/README.md"
      - "!**/readme.md"
      - "!apps/portfolio/SETUP.md"
      - "!apps/portfolio/src/data/credential-logo-sources.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    concurrency:
      group: portfolio-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, test, and build
        run: pnpm run check

      - name: Install Playwright browser
        run: pnpm --filter portfolio-app exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm --filter portfolio-app exec playwright test

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-playwright-results
          path: apps/portfolio/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy portfolio
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ryanlau1220.dev
    defaults:
      run:
        working-directory: apps/portfolio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Build production assets
        run: pnpm run build

      - name: Apply pending D1 migrations
        run: pnpm exec wrangler d1 migrations apply VISITOR_LOG_DB --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
