name: Secret scan

# Scans for committed secrets. On PRs it checks only the pushed range; on push and the
# weekly schedule it scans the full history. Uses the gitleaks binary directly, which is
# free for any repo (the gitleaks-action wrapper needs a paid license for organizations).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --verbose
