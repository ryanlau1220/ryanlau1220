name: CodeQL

# Static analysis for JavaScript/TypeScript. Runs on PRs, pushes to main, and weekly.
# Kept separate from the deploy pipeline so its longer scan never gates deployments.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          # Favor fewer false positives over exhaustive, noisy results.
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/*.gen.ts"
              - "**/worker-configuration.d.ts"
              - "**/tests/**"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
