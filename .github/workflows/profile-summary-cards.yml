name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          UTC_OFFSET: 8

      - name: fetch streak stats card
        run: |
          mkdir -p profile-summary-card-output/2077
          curl -s --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=ryanlau1220&mode=weekly&hide_border=true&background=141321&stroke=ff0055&ring=fcee0c&fire=fcee0c&currStreakNum=03d8f3&sideNums=03d8f3&currStreakLabel=ff0055&sideLabels=03d8f3&dates=03d8f3" \
            -o profile-summary-card-output/2077/streak-stats.svg
          cp profile-summary-card-output/2077/streak-stats.svg profile-summary-card-output/streak-stats.svg

      - name: push profile-summary-cards to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: profile-summary-card-output
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
