name: Portfolio CI and production deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "my-portfolio/**"
      - ".github/workflows/portfolio-deploy.yml"
  push:
    branches: [main]
    paths:
      - "my-portfolio/**"
      - ".github/workflows/portfolio-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-portfolio
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: my-portfolio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, and build
        run: pnpm run check

      - name: Install Playwright browser
        run: pnpm --filter portfolio-app exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm --filter portfolio-app exec playwright test

  deploy:
    name: Deploy portfolio
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://portfolio.ryanlau1220.workers.dev
    defaults:
      run:
        working-directory: my-portfolio/apps/portfolio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: my-portfolio/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: my-portfolio
        run: pnpm install --frozen-lockfile

      - name: Build production assets
        run: pnpm run build

      - name: Apply pending D1 migrations
        run: pnpm exec wrangler d1 migrations apply VISITOR_LOG_DB --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
