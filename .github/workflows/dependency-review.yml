name: Dependency review

# Blocks pull requests that introduce dependencies with known vulnerabilities or
# disallowed licenses. Runs only on PRs, where it can compare the base and head.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
